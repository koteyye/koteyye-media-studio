[package]
name = "km-ui"
description = "UI Koteyye Media Studio на Dioxus, компилируется в WASM"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["web"] }
km-shared = { version = "2.0.0", path = "../crates/km-shared" }
# IPC-биндинг (src/ipc.rs): serde JSON через границу WASM, Promise -> Future.
serde = "1.0.229"
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["console"] }
