name: Signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Сверить выбранный тег с Cargo, Tauri и коммитом запуска
        run: python3 .github/scripts/release.py check-version

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Подготовить Rust, WASM и CLI из официальных архивов
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          if [[ "$RUNNER_OS" == macOS ]]; then
            rustup target add --toolchain "$RUSTUP_TOOLCHAIN" aarch64-apple-darwin x86_64-apple-darwin
          fi
          python .github/scripts/release.py install-tools

      - name: Нативные тесты
        run: cargo test --workspace --locked

      - name: Импортировать сертификат подписи кода Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'studio-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certs = @(Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My |
              Where-Object HasPrivateKey)
            if ($certs.Count -ne 1) { throw 'В PFX требуется один сертификат с закрытым ключом.' }
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($certs[0].Thumbprint)" >> $env:GITHUB_ENV
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx }
          }

      - name: Собрать подписанный NSIS и проверить установленные байты
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/release.py configure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo tauri build --ci --bundles nsis --config (Join-Path $env:RUNNER_TEMP 'studio-release.json') -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Ожидался один NSIS-установщик.' }
          function Assert-StudioSignature([string]$file) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid' -or !$sig.TimeStamperCertificate -or
                $sig.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Недействительная Authenticode-подпись или метка времени у $file"
            }
          }
          Assert-StudioSignature $installers[0].FullName
          $installed = Join-Path $env:RUNNER_TEMP 'studio-install-check'
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installed") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "NSIS вернул $($setup.ExitCode)" }
          Assert-StudioSignature (Join-Path $installed 'koteyye-media-studio.exe')

      - name: Убрать импортированный сертификат из хранилища раннера
        if: always() && runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_THUMBPRINT != ''
        shell: pwsh
        run: |
          $thumb = $env:WINDOWS_CERTIFICATE_THUMBPRINT
          if ($thumb -match '^[0-9a-fA-F]{40}$') {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumb" -DeleteKey
          }

      - name: Собрать universal macOS, проверить приложение и заверить DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 .github/scripts/release.py configure
          cargo tauri build --ci --target universal-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/studio-release.json" -- --locked
          bundle=target/universal-apple-darwin/release/bundle
          archives=("$bundle"/macos/*.app.tar.gz)
          disks=("$bundle"/dmg/*.dmg)
          [[ ${#archives[@]} == 1 && ${#disks[@]} == 1 ]]
          check="$RUNNER_TEMP/studio-update-check"
          mkdir -p "$check"
          tar -xzf "${archives[0]}" -C "$check"
          apps=("$check"/*.app)
          [[ ${#apps[@]} == 1 ]]
          app=${apps[0]}
          dmg=${disks[0]}
          binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$binary" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -Fx "Authority=$APPLE_SIGNING_IDENTITY"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          codesign --verify --strict "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          python3 -c 'import json, sys; s=json.load(open(sys.argv[1]))["status"]; sys.exit(0 if s == "Accepted" else s)' "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature "$dmg"

      - name: Подготовить проверенные файлы
        run: python .github/scripts/release.py stage ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.platform }}
          path: release-stage/
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-*
          path: release-stage
          merge-multiple: true
      - name: Проверить подписи обоих обновлений и собрать latest.json
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          python3 .github/scripts/release.py verify-manifest
      - name: Подготовить черновик GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py draft-release
