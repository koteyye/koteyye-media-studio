[package]
name = "km-core"
description = "Ядро Koteyye Media Studio: генерация медиа через Cheaper Inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# reqwest 0.13: TLS по умолчанию — rustls (без системного OpenSSL),
# system-proxy в дефолтных фичах читает системные прокси macOS.
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
km-shared = { version = "2.0.0", path = "../km-shared" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
